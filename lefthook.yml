commit-msg:
  scripts:
    "commitlint.sh":
      runner: bash

pre-commit:
  commands:
    1_format_write:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx biome format --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files} && git update-index --again
    2_lint_check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files} && git update-index --again
    3_type_check:
      glob: "*.{json,js,ts,tsx}"
      run: npx tsc --noEmit -p ./tsconfig.json

pre-push:
  commands:
    1_format_write:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx biome format --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files} && git update-index --again
    2_lint_check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx biome check --no-errors-on-unmatched --files-ignore-unknown=true {push_files}
    3_type_check:
      glob: "*.{json,js,ts,tsx}"
      run: npx tsc --noEmit -p ./tsconfig.json
    4_build:
      run: npx vite build
    4_bundlesize_check:
      run: npx bundlewatch --config bundlewatch.config.json
